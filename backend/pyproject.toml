[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-backend"
version = "0.2.0"
description = "AEGIS backend -- aegis/ (Phase 1 walking skeleton) + app/ (Phase 2 service foundation)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.4,<3",
    "docker>=7,<8",
    "fastapi>=0.111,<0.116",
    "uvicorn[standard]>=0.30,<0.31",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    "GitPython>=3.1,<4",
    "networkx>=3.2,<4",
    "httpx>=0.27,<0.28",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
    "ruff>=0.6,<0.7",
    "black>=24.8,<25",
    "mypy>=1.11,<2",
    "pip-tools>=7,<8",
]
live-ai = [
    "anthropic>=0.4,<1",
]
# Phase 26 security gate: SAST + dependency audit + SBOM. Kept separate from
# `dev` so a normal dev install stays lean; CI installs ".[dev,sec]".
sec = [
    "bandit>=1.7,<2",
    "pip-audit>=2.7,<3",
    "cyclonedx-bom>=4,<6",
]

[tool.setuptools.packages.find]
include = ["aegis*", "app*"]

[tool.bandit]
# Scan app/ only (aegis/ is Phase 1 skeleton code, like the mypy gate).
# B101 (assert): pytest + Pydantic-style asserts are idiomatic here.
# B404/B603: subprocess use is funnelled through core/security/subprocess_guard
#   (allowlisted, never shell) and covered by tests/security/test_subprocess_guard.py.
skips = ["B101", "B404", "B603"]
exclude_dirs = ["tests", "aegis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: requires a running Docker daemon (skipped automatically when absent)",
    "live_ai: exercises a real AI provider (opt-in; runs only with RUN_LIVE_AI=1)",
    "e2e: full-pipeline end-to-end acceptance tests (mock provider + fake sandbox)",
    "benchmark: drives the benchmarks/ harness over a curated dataset (slow; mock provider + fake sandbox)",
    "security: Phase 26 threat / abuse tests (auto-applied to tests/security/)",
]
# All tests here are plain functions; disable class-based collection so
# pytest doesn't warn about domain schemas named Test* (TestOutcome,
# TestExecutionResult -- real names from docs/AI_AGENT_DESIGN.md, not renamed
# just to satisfy a collection heuristic).
python_classes = "NoClassBasedTestsHere"
