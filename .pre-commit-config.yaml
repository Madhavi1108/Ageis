repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (backend)
        entry: ruff check
        language: system
        files: ^backend/
        types: [python]

      - id: black
        name: black (backend)
        entry: black --check
        language: system
        files: ^backend/
        types: [python]

      - id: mypy
        name: mypy (backend/app)
        entry: mypy
        language: system
        files: ^backend/app/
        types: [python]
        pass_filenames: false
        args: ["backend/app"]

      - id: eslint
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
