name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend package (dev)
        run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: black --check
        run: black --check .

      - name: mypy (app/)
        run: mypy app

      - name: pytest (+ coverage)
        run: pytest tests -q --cov=app --cov=aegis --cov-report=xml --cov-report=term --cov-fail-under=70

      - name: Quickstart end-to-end smoke test
        # Documentation-accuracy gate (plan §36): the README / USER_GUIDE
        # one-command path must reach COMPLETED. No Docker required. The
        # docs-drift gates (API reference freshness, link check, support-matrix
        # evidence, acceptance contract) run inside `pytest tests` above.
        run: python ../scripts/quickstart_check.py

      - name: Alembic upgrade/downgrade smoke test
        run: |
          rm -f /tmp/ci_migration_smoke.db
          AEGIS_DATABASE_URL="sqlite:////tmp/ci_migration_smoke.db" alembic upgrade head
          AEGIS_DATABASE_URL="sqlite:////tmp/ci_migration_smoke.db" alembic downgrade base

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend package (dev + sec)
        run: pip install -e ".[dev,sec]"

      - name: Lockfile is in sync with pyproject
        run: |
          pip-compile --extra dev --quiet --output-file requirements.lock.check pyproject.toml
          diff -u requirements.lock requirements.lock.check || (echo "requirements.lock is stale -- run pip-compile" && exit 1)

      - name: bandit (SAST, app/)
        # Fail on MEDIUM+ severity. LOW findings (try/except/pass, stdlib xml
        # import, weight-constant false positives) are advisory; targeted
        # MEDIUM/HIGH exceptions carry an inline `# nosec <id>` with a reason.
        run: bandit -c pyproject.toml -q -r app --severity-level medium

      - name: pip-audit (known CVEs)
        # Add "--ignore-vuln <GHSA/PYSEC id>  # reason, expiry" here to triage a
        # finding with a documented exception (docs/TECH_STACK.md Section 3).
        run: pip-audit -r requirements.lock --strict

      - name: Generate CycloneDX SBOM
        run: cyclonedx-py requirements requirements.lock -o sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom
          path: backend/sbom.json

      - name: Threat suite
        run: pytest tests/security -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Playwright is manual/non-blocking and not run in CI; skip its browser download.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: eslint
        run: npm run lint

      - name: tsc (app + tests)
        run: |
          npm run typecheck
          npm run typecheck:test

      - name: vitest
        run: npm run test

      - name: build
        run: npm run build
