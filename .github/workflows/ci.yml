name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend package (dev)
        run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: black --check
        run: black --check .

      - name: mypy (app/)
        run: mypy app

      - name: pytest (+ coverage)
        run: pytest tests -q --cov=app --cov=aegis --cov-report=xml --cov-report=term --cov-fail-under=70

      - name: Alembic upgrade/downgrade smoke test
        run: |
          rm -f /tmp/ci_migration_smoke.db
          AEGIS_DATABASE_URL="sqlite:////tmp/ci_migration_smoke.db" alembic upgrade head
          AEGIS_DATABASE_URL="sqlite:////tmp/ci_migration_smoke.db" alembic downgrade base

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: eslint
        run: npm run lint

      - name: tsc --noEmit
        run: npx tsc -b --noEmit

      - name: build
        run: npm run build
