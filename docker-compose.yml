# AEGIS dev stack. Default profile uses SQLite (zero extra infra); pass
# `--profile postgres` and set AEGIS_DATABASE_URL to use the postgres service.
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file:
      - .env
    environment:
      AEGIS_CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend

  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    # The real job worker: a single sequential process (ADR-0003). Run exactly
    # one per database. Needs Docker-in-Docker or a mounted daemon socket for the
    # real sandbox; otherwise executions degrade to PARTIALLY_SUPPORTED.
    command: ["python", "-m", "app.orchestration.worker"]
    env_file:
      - .env
    depends_on:
      - api
    volumes:
      - ./backend:/app/backend

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      VITE_API_BASE_URL: "http://localhost:8000"
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
    ports:
      - "5432:5432"
    volumes:
      - aegis-postgres-data:/var/lib/postgresql/data

volumes:
  aegis-postgres-data:
